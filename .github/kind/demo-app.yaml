# Demo workloads applied to kind cluster by e2e and integration workflows.
# Mirrors the local-dev fixture documented in QUICKSTART.md.
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    purpose: portal-smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo-app
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo-app
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: hello
          image: hashicorp/http-echo:1.0
          args: ["-text=hello-from-api","-listen=:8080"]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: demo-app }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80, name: http }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: demo-app }
spec:
  selector: { app: api }
  ports: [{ port: 8080, targetPort: 8080, name: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: demo-app
spec:
  rules:
    - host: demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: web, port: { number: 80 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: api, port: { number: 8080 } } }
