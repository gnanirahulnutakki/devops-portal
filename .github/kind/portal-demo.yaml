# Kind cluster used by e2e and integration GitHub Actions workflows,
# and runnable locally via:  kind create cluster --config .github/kind/portal-demo.yaml
#
# Single-node config for CI; local users can use the same config or override.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: portal-demo
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
