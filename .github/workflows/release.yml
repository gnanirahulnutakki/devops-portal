name: Release (tag-triggered)

# Build + sign + publish on every v* tag.
# This workflow is the "trusted lane" — keep it simple and use env: for any
# untrusted-shaped values per GitHub's workflow injection guidance.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: build + release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Capture github context into env vars early so all run: blocks use
      # plain shell variables, not ${{ }} expressions inline.
      TAG_NAME: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }

      - name: Verify package.json version matches tag
        run: |
          PKG_VER=$(jq -r .version package.json)
          TAG_VER="${TAG_NAME#v}"
          if [[ "$PKG_VER" != "$TAG_VER" ]]; then
            echo "::error::package.json version ($PKG_VER) does not match tag ($TAG_VER). Bump package.json before tagging."
            exit 1
          fi

      - name: Install + quality gates
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push container image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.TAG_NAME }}
            ghcr.io/${{ env.REPO }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.REPO }}
            org.opencontainers.image.version=${{ env.TAG_NAME }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: '1'
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/${REPO}@${IMAGE_DIGEST}"

      - name: Create GitHub release (or skip if exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; not re-creating."
            exit 0
          fi
          VER="${TAG_NAME#v}"
          NOTES_FILE=$(mktemp)
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; print; next }
            capture && /^## \[/ { capture=0 }
            capture { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Release $TAG_NAME. See [CHANGELOG.md](CHANGELOG.md) for details." > "$NOTES_FILE"
          fi
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes-file "$NOTES_FILE" \
            --latest
