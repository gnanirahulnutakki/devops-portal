name: Runtime CI and Docker

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'scripts/**'
      - 'helm/devops-portal/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'instrumentation.ts'
      - '.github/workflows/docker-build-push.yml'
      - '.github/workflows/README.md'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'public/**'
      - 'scripts/**'
      - 'helm/devops-portal/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.env.example'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.js'
      - 'eslint.config.mjs'
      - 'vitest.config.ts'
      - 'tsconfig.json'
      - 'instrumentation.ts'
      - '.github/workflows/docker-build-push.yml'
      - '.github/workflows/README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional Docker image tag override'
        required: false
        default: ''

env:
  NODE_VERSION: '22'
  DOCKER_IMAGE: rahulnutakki/devops-portal
  DOCKERFILE_PATH: ./Dockerfile
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-nextauth-secret-32-characters
  AUTH_SECRET: ci-nextauth-secret-32-characters
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devops_portal_ci?schema=public
  REDIS_URL: ''
  TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  AUTH_MODE: multi
  ENABLE_CREDENTIALS_AUTH: 'true'
  GITHUB_USE_MOCK_DATA: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  security-events: write

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build application
        run: npm run build

  docker:
    name: Docker Build And Push
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine image tags
        id: tags
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tags=${{ env.DOCKER_IMAGE }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${{ env.DOCKER_IMAGE }}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "primary_tag=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH_NAME" = "main" ]; then
            echo "tags=${{ env.DOCKER_IMAGE }}:latest,${{ env.DOCKER_IMAGE }}:$SHA_SHORT,${{ env.DOCKER_IMAGE }}:$DATE" >> "$GITHUB_OUTPUT"
            echo "primary_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.DOCKER_IMAGE }}:dev,${{ env.DOCKER_IMAGE }}:dev-$SHA_SHORT,${{ env.DOCKER_IMAGE }}:dev-$DATE" >> "$GITHUB_OUTPUT"
            echo "primary_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for pull requests
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}
            NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            DATABASE_URL=${{ env.DATABASE_URL }}
            NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Generate build summary
        if: github.event_name != 'pull_request'
        run: |
          echo "## Runtime CI and Docker Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dockerfile:** \`${{ env.DOCKERFILE_PATH }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Primary tag:** \`${{ steps.tags.outputs.primary_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**All tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ steps.tags.outputs.primary_tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: container-scan
