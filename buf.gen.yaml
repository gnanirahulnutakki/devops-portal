version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/gnanirahulnutakki/devops-portal/agent/proto
plugins:
  - local: protoc-gen-go
    out: agent/proto
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: agent/proto
    opt:
      - paths=source_relative
