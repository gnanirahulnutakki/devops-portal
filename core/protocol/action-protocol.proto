syntax = "proto3";

// Multi-Cluster MCP Federation Protocol — v0.1 wire freeze candidate. Decisions D1, D2, D3, D5, D8, D14, D16 applied per core/protocol/docs/.

package tbd_project_name.action.v0;

option go_package = "github.com/TBD_PROJECT_NAME/go/action/v0;actionv0";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

service ActionProtocol {
  rpc Connect(stream AgentEnvelope) returns (stream ControlEnvelope);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_ACCEPTED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_SUCCEEDED = 3;
  OPERATION_STATE_FAILED = 4;
  OPERATION_STATE_CANCELLED = 5;
  OPERATION_STATE_REJECTED = 6;
  OPERATION_STATE_TIMED_OUT = 7;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_DENY = 2;
  DECISION_REQUIRE_APPROVAL = 3;
  DECISION_DEFER = 4;
}

enum AdapterOperationClass {
  ADAPTER_OPERATION_CLASS_UNSPECIFIED = 0;
  ADAPTER_OPERATION_CLASS_READ = 1;
  ADAPTER_OPERATION_CLASS_WRITE = 2;
  ADAPTER_OPERATION_CLASS_DELETE = 3;
  ADAPTER_OPERATION_CLASS_EXECUTE = 4;
}

enum ReconnectBehavior {
  RECONNECT_BEHAVIOR_UNSPECIFIED = 0;
  RECONNECT_BEHAVIOR_RESUME = 1;
  RECONNECT_BEHAVIOR_REPLAY = 2;
  RECONNECT_BEHAVIOR_FAIL = 3;
}

enum LockScope {
  LOCK_SCOPE_UNSPECIFIED = 0;
  LOCK_SCOPE_NONE = 1; // Adapter has no shared state; conflicts impossible.
  LOCK_SCOPE_TARGET = 2; // One operation per target_uri.
  LOCK_SCOPE_GROUP = 3; // One operation per adapter-defined target group.
  LOCK_SCOPE_ADAPTER = 4; // One operation per adapter regardless of target.
}

message AgentEnvelope {
  string agent_id = 1;
  string stream_id = 2;
  uint64 sequence = 3;
  bytes nonce = 4;
  google.protobuf.Timestamp sent_at = 5;
  bytes signature = 6;
  string key_id = 7;

  oneof payload {
    AgentHello hello = 10;
    StreamKeepalive keepalive = 11;
    OperationAck operation_ack = 12;
    OperationProgress operation_progress = 13;
    OperationResult operation_result = 14;
    AgentGoodbye goodbye = 15;
  }

  reserved 16;
}

message ControlEnvelope {
  string gateway_id = 1;
  string stream_id = 2;
  uint64 sequence = 3;
  string command_id = 4;
  google.protobuf.Timestamp sent_at = 5;
  bytes signature = 6;
  string key_id = 7;

  oneof payload {
    OperationRequest operation_request = 10;
    OperationCancel operation_cancel = 11;
    PolicyUpdate policy_update = 12;
    RevocationNotice revocation_notice = 13;
    HealthCheck health_check = 14;
  }
}

message AgentHello {
  string protocol_version = 1;
  string agent_id = 2;
  string cluster_id = 3;
  string namespace = 4;
  string service_account = 5;
  repeated AdapterCapability capabilities = 6;
  string policy_hash = 7;
  google.protobuf.Timestamp started_at = 8;
  repeated string supported_schemas = 10;
  repeated string supported_features = 11;
  uint32 max_concurrent_ops = 12;
  repeated string supported_protocol_versions = 13;
}

message AgentGoodbye {
  string reason = 1;
  bool retryable = 2;
  ReconnectBehavior reconnect_behavior = 3;
  google.protobuf.Duration retry_after = 4;
}

message StreamKeepalive {
  google.protobuf.Timestamp observed_at = 1;
  google.protobuf.Timestamp cert_expires_at = 2;
  uint32 inflight_operations = 3;
  string policy_hash = 4;
}

message AdapterCapability {
  string adapter_id = 1;
  string name = 2;
  string version = 3;
  repeated string supported_operations = 4;
  repeated AdapterOperationClass operation_classes = 5;
  repeated string supported_resource_types = 6;
  bool supports_cancel = 7;
  bool supports_resume = 8;
  google.protobuf.Duration default_timeout = 9;
  uint32 max_concurrent_operations = 10;
  repeated string required_features = 11;
  repeated CredentialReference credential_references = 12;
  LockScope lock_scope = 13;
}

message CredentialReference {
  string credential_uri = 1;
  string credential_version = 2;
  string provider = 3;
  string required_scope = 4;
}

message OperationRequest {
  string operation_id = 1;
  string adapter_id = 2;
  string operation = 3;
  AdapterOperationClass operation_class = 4;
  string schema_uri = 5;
  PolicyVerdict policy_verdict = 6;
  google.protobuf.Timestamp requested_at = 7;
  google.protobuf.Duration timeout = 8;
  string idempotency_key = 9;
  string trace_id = 10;
  string parent_operation_id = 11;
  bytes payload_digest = 13;
  bytes payload = 14;
  string target_uri = 15;
  repeated CredentialReference credential_references = 16;
}

message OperationAck {
  string operation_id = 1;
  OperationState state = 2;
  google.protobuf.Timestamp accepted_at = 3;
  string message = 4;
  string agent_operation_id = 5;
}

message OperationProgress {
  string operation_id = 1;
  OperationState state = 2;
  uint32 percent_complete = 3;
  string message = 4;
  bytes summary_payload = 5;
  google.protobuf.Timestamp observed_at = 6;
}

message OperationResult {
  string operation_id = 1;
  OperationState state = 2;
  google.protobuf.Timestamp completed_at = 3;
  string message = 4;
  string output_schema_uri = 5;
  bytes output_digest = 6;
  string error_code = 7;
  string error_details = 8;
  bool retryable = 9;
  bytes output_payload = 10;
}

message OperationCancel {
  string operation_id = 1;
  string reason = 2;
  google.protobuf.Timestamp requested_at = 3;
}

message PolicyUpdate {
  string policy_id = 1;
  string policy_hash = 2;
  bytes policy_bundle = 3;
  google.protobuf.Timestamp effective_at = 4;
  string signature_key_id = 5;
  bytes signature = 6;
}

message RevocationNotice {
  string credential_uri = 1;
  string credential_version = 2;
  string reason = 3;
  google.protobuf.Timestamp revoked_at = 4;
}

message HealthCheck {
  string check_id = 1;
  google.protobuf.Timestamp requested_at = 2;
  google.protobuf.Duration timeout = 3;
}

message PolicyVerdict {
  Decision decision = 1;
  string policy_id = 2;
  string policy_hash = 3;
  string reason = 4;
  repeated string obligations = 5;
  google.protobuf.Timestamp evaluated_at = 6;
  google.protobuf.Duration ttl = 7;
}

message EnrollRequest {
  string agent_id = 1;
  string cluster_id = 2;
  string namespace = 3;
  string service_account = 4;
  bytes csr = 5;
  string attestation_type = 6;
  bytes attestation = 7;
  google.protobuf.Timestamp requested_at = 8;
}

message EnrollResponse {
  string agent_id = 1;
  bytes certificate_chain = 2;
  bytes ca_bundle = 3;
  google.protobuf.Timestamp issued_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  string policy_hash = 6;
  string gateway_id = 7;
}

message AuditEvent {
  string event_id = 1;
  string operation_id = 2;
  string agent_id = 3;
  string gateway_id = 4;
  OperationState state = 5;
  Decision decision = 6;
  string policy_hash = 7;
  google.protobuf.Timestamp observed_at = 8;
  bytes request_digest = 9;
  bytes result_digest = 10;
  string trace_id = 11;
}
