apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: m19-mcp
  labels:
    app.kubernetes.io/name: federation-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: m19-mcp-federation
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: federation-gateway
  ports:
  - name: federation
    port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: m19-mcp
  labels:
    app.kubernetes.io/name: federation-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: m19-mcp-federation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: federation-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: federation-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: gateway
        image: ghcr.io/m19-federation/gateway:m1.9
        args:
        - "--addr=0.0.0.0:8080"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: audit-storage
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
      volumes:
      - name: audit-storage
        emptyDir: {}
