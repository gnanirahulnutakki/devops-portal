apiVersion: v1
kind: Pod
metadata:
  name: demo-caller
  namespace: m19-mcp
  labels:
    app.kubernetes.io/name: demo-caller
    app.kubernetes.io/component: caller
    app.kubernetes.io/part-of: m19-mcp-federation
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
  - name: caller
    image: ghcr.io/m19-federation/agent:m1.9
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: jwt-token
      mountPath: /etc/m19-jwt
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
  volumes:
  - name: jwt-token
    configMap:
      name: jwt-config
