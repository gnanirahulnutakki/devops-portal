{{- if .Values.secretsStoreCsi.enabled -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretsStoreCsi.secretProviderClassName | default (include "devops-portal.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devops-portal.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secretsStoreCsi.provider | default "aws" | quote }}
  {{- if and (.Values.secretsStoreCsi.syncToKubernetesSecret | default true) (.Values.externalSecrets.enabled | not) }}
  secretObjects:
    - secretName: {{ .Values.secrets.existingSecret | default "devops-portal-secrets" | quote }}
      type: Opaque
      data:
        # NOTE: This list is provider-specific and must match the mounted object names.
        # Keep empty by default; configure via values for your provider.
        {{- with .Values.secretsStoreCsi.secretObjects }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- end }}
  parameters:
    {{- toYaml .Values.secretsStoreCsi.parameters | nindent 4 }}
{{- end }}

