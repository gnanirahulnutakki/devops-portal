{{- if and .Values.mailpit.enabled .Values.mailpit.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "devops-portal.fullname" . }}-mailpit
  labels:
    {{- include "devops-portal.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
  {{- with .Values.mailpit.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.mailpit.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.mailpit.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "devops-portal.fullname" . }}-mailpit
                port:
                  name: http
  {{- with .Values.mailpit.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
