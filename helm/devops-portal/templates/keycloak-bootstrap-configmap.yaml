{{- if .Values.keycloakBootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-portal.fullname" . }}-kc-bootstrap
  labels:
    {{- include "devops-portal.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  bootstrap.sh: |
    #!/bin/sh
    set -e

    KC_URL="{{ .Values.keycloakBootstrap.keycloakInternalUrl }}"
    REALM="{{ .Values.keycloakBootstrap.realm }}"
    ADMIN_USER="{{ .Values.keycloakBootstrap.adminUser }}"
    CLIENT_ID="{{ .Values.integrations.keycloak.existingSecret | default "devops-portal-keycloak" }}"

    WAIT_TIMEOUT={{ .Values.keycloakBootstrap.waitTimeoutSeconds | default 240 }}
    echo "==> Waiting for Keycloak to be ready (timeout: ${WAIT_TIMEOUT}s)..."
    DEADLINE=$(($(date +%s) + WAIT_TIMEOUT))
    until curl -sf "${KC_URL}/realms/master" > /dev/null 2>&1; do
      if [ "$(date +%s)" -ge "$DEADLINE" ]; then
        echo "ERROR: Keycloak not reachable after ${WAIT_TIMEOUT}s — giving up."
        exit 1
      fi
      echo "    Keycloak not ready, retrying in 5s..."
      sleep 5
    done
    echo "    Keycloak is up."

    echo "==> Authenticating as master admin..."
    TOKEN=$(curl -sf -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      -d "grant_type=password&client_id=admin-cli&username=${ADMIN_USER}&password=${KC_ADMIN_PASSWORD}" \
      | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)

    if [ -z "$TOKEN" ]; then
      echo "ERROR: Could not obtain admin token. Check KEYCLOAK_ADMIN_PASSWORD in secret."
      exit 1
    fi
    echo "    Token obtained."

    # -------------------------------------------------------------------------
    # Realm
    # -------------------------------------------------------------------------
    echo "==> Ensuring realm '${REALM}' exists..."
    HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
      -H "Authorization: Bearer ${TOKEN}" \
      "${KC_URL}/admin/realms/${REALM}")

    if [ "$HTTP_STATUS" = "404" ]; then
      echo "    Creating realm '${REALM}'..."
      curl -sf -X POST "${KC_URL}/admin/realms" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"realm\": \"${REALM}\",
          \"enabled\": true,
          \"registrationAllowed\": false,
          \"loginWithEmailAllowed\": true,
          \"bruteForceProtected\": false,
          \"sslRequired\": \"external\"
        }"
      echo "    Realm created."
    else
      echo "    Realm already exists (HTTP ${HTTP_STATUS}), skipping."
    fi

    # -------------------------------------------------------------------------
    # OIDC Client
    # -------------------------------------------------------------------------
    echo "==> Ensuring OIDC client '${REALM}' exists..."
    CLIENT_CHECK=$(curl -sf \
      -H "Authorization: Bearer ${TOKEN}" \
      "${KC_URL}/admin/realms/${REALM}/clients?clientId=${REALM}" \
      | grep -c "\"clientId\"" || true)

    if [ "$CLIENT_CHECK" = "0" ]; then
      echo "    Creating OIDC client..."
      # Build redirect URIs JSON array
      REDIRECT_URIS='[{{ range $i, $uri := .Values.keycloakBootstrap.clientRedirectUris }}{{ if $i }},{{ end }}"{{ $uri }}"{{ end }}]'
      curl -sf -X POST "${KC_URL}/admin/realms/${REALM}/clients" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"clientId\": \"${REALM}\",
          \"enabled\": true,
          \"protocol\": \"openid-connect\",
          \"publicClient\": false,
          \"standardFlowEnabled\": true,
          \"directAccessGrantsEnabled\": false,
          \"secret\": \"${KEYCLOAK_CLIENT_SECRET}\",
          \"redirectUris\": ${REDIRECT_URIS},
          \"webOrigins\": [\"+\"]
        }"
      echo "    Client created."
    else
      echo "    Client already exists, skipping."
    fi

    # -------------------------------------------------------------------------
    # Default Users
    # -------------------------------------------------------------------------
    {{- range .Values.keycloakBootstrap.defaultUsers }}
    echo "==> Ensuring user '{{ .username }}' exists..."
    USER_RESPONSE=$(curl -sf \
      -H "Authorization: Bearer ${TOKEN}" \
      "${KC_URL}/admin/realms/${REALM}/users?username={{ .username }}&exact=true")
    USER_CHECK=$(echo "$USER_RESPONSE" | grep -c "\"username\"" || true)

    if [ "$USER_CHECK" = "0" ]; then
      echo "    Creating user '{{ .username }}'..."
      CREATE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
        -X POST "${KC_URL}/admin/realms/${REALM}/users" \
        -H "Authorization: Bearer ${TOKEN}" \
        -H "Content-Type: application/json" \
        -d "{
          \"username\": \"{{ .username }}\",
          \"email\": \"{{ .email }}\",
          \"firstName\": \"{{ .firstName }}\",
          \"lastName\": \"{{ .lastName }}\",
          \"enabled\": true,
          \"emailVerified\": true,
          \"requiredActions\": []
        }")
      if [ "$CREATE_STATUS" = "201" ] || [ "$CREATE_STATUS" = "409" ]; then
        echo "    User '{{ .username }}' created."
      else
        echo "    WARNING: Unexpected status ${CREATE_STATUS} creating user '{{ .username }}'."
      fi
      # Re-fetch to get user ID
      USER_RESPONSE=$(curl -sf \
        -H "Authorization: Bearer ${TOKEN}" \
        "${KC_URL}/admin/realms/${REALM}/users?username={{ .username }}&exact=true")
    fi

    # Always ensure password is set (idempotent — works for new and existing users)
    if [ -n "${KC_DEFAULT_USER_PASSWORD}" ]; then
      USER_ID=$(echo "$USER_RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
      if [ -n "$USER_ID" ]; then
        PW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
          -X PUT "${KC_URL}/admin/realms/${REALM}/users/${USER_ID}/reset-password" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: application/json" \
          -d "{\"type\":\"password\",\"value\":\"${KC_DEFAULT_USER_PASSWORD}\",\"temporary\":false}")
        if [ "$PW_STATUS" = "204" ]; then
          echo "    Password set for '{{ .username }}'."
        else
          echo "    WARNING: Password reset returned HTTP ${PW_STATUS} for '{{ .username }}'."
        fi
      else
        echo "    WARNING: Could not determine user ID for '{{ .username }}'."
      fi
    else
      echo "    WARNING: KC_DEFAULT_USER_PASSWORD is empty — skipping password for '{{ .username }}'."
    fi
    {{- end }}

    echo "==> Keycloak bootstrap complete."
{{- end }}
