{{- if and .Values.trivyOperator.enabled (.Values.trivyOperator.rbac.create | default true) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "devops-portal.fullname" . }}-trivy-operator-reports
  labels:
    {{- include "devops-portal.labels" . | nindent 4 }}
rules:
  # Detect CRDs and list reports (read-only)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "devops-portal.fullname" . }}-trivy-operator-reports
  labels:
    {{- include "devops-portal.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "devops-portal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "devops-portal.fullname" . }}-trivy-operator-reports
{{- end }}

