# =============================================================================
# DevOps Portal - saasops1 Deployment Values
# Cluster: self-managed-test-dev01
# Namespace: duploservices-saasops1
# =============================================================================

replicaCount: 1

image:
  repository: rahulnutakki/devops-portal
  tag: "v2-latest"
  pullPolicy: Always

config:
  baseUrl: "https://devops-portal.dev01.radiantlogic.io"
  enableCredentialsAuth: true  # Enable local login
  logLevel: "info"
  bcryptRounds: 10

# Disable autoscaling for dev
autoscaling:
  enabled: false

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

# Use existing ALB ingress (managed by DuploCloud)
ingress:
  enabled: false  # Ingress already exists

# Enable Trivy Operator for runtime vulnerability reports
trivyOperator:
  enabled: true

# Use existing secret for app configuration
secrets:
  useSealedSecrets: false
  existingSecret: "devops-portal-secrets"

# PostgreSQL - disabled, using external
postgresql:
  enabled: false

externalDatabase:
  host: "devops-portal-postgres"
  port: 5432
  database: "devops_portal"
  username: "postgres"
  existingSecret: "devops-portal-secrets"
  existingSecretPasswordKey: "POSTGRES_PASSWORD"
  sslMode: "disable"

# Redis - disabled, use mock/in-memory
redis:
  enabled: false

externalRedis:
  host: "localhost"  # Not used
  port: 6379
  existingSecret: "devops-portal-secrets"
  existingSecretPasswordKey: "REDIS_PASSWORD"

# MinIO - disabled (use external if needed)
minio:
  enabled: false

# Integrations - connect to namespace services
integrations:
  argocd:
    enabled: true
    url: "https://argocd-server.duploservices-saasops1.svc.cluster.local"
    existingSecret: "devops-portal-secrets"
    tokenKey: "ARGOCD_TOKEN"
    insecure: true
  
  grafana:
    enabled: true
    url: "http://grafana-local.duploservices-saasops1.svc.cluster.local:80"
    existingSecret: "devops-portal-secrets"
    apiKeyKey: "GRAFANA_API_KEY"
  
  prometheus:
    enabled: true
    url: "http://prom-local-prometheus-server.duploservices-saasops1.svc.cluster.local:80"
  
  github:
    enabled: true
    existingSecret: "devops-portal-secrets"
    clientIdKey: "GITHUB_OAUTH_CLIENT_ID"
    clientSecretKey: "GITHUB_OAUTH_CLIENT_SECRET"
  
  keycloak:
    enabled: false

# Disable network policies
networkPolicy:
  enabled: false

# Disable PDB for single replica
podDisruptionBudget:
  enabled: false

# Disable ServiceMonitor
serviceMonitor:
  enabled: false

# DuploCloud node selector
nodeSelector:
  tenantname: duploservices-saasops1

# Init containers - all disabled for simpler deployment
initContainers:
  waitForDb:
    enabled: false
  migrate:
    enabled: false  # Run migrations manually if needed

# Seed database with demo data
jobs:
  seed:
    enabled: false

# Extra environment variables
extraEnv:
  - name: NODE_TLS_REJECT_UNAUTHORIZED
    value: "0"
  - name: AUTH_TRUST_HOST
    value: "true"
  - name: AUTH_URL
    value: "https://devops-portal.dev01.radiantlogic.io"
  - name: AUTH_SECRET
    valueFrom:
      secretKeyRef:
        name: devops-portal-secrets
        key: NEXTAUTH_SECRET
  - name: GITHUB_TOKEN
    valueFrom:
      secretKeyRef:
        name: devops-portal-secrets
        key: GITHUB_TOKEN
  - name: GITHUB_ORGANIZATION
    value: "radiantlogic-saas"
  # Security scan jobs default namespace (where portal runs)
  - name: SECURITY_SCAN_NAMESPACE
    value: "duploservices-saasops1"
